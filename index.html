<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#e9e1d5" />
  <meta name="description" content="NADI. | Modest Wear — свадебные и вечерние платья для покрытых девушек." />
  <title>NADI. | Modest Wear</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --dark: #40362e;
      --muted: #75685c;
      --gold: #b28d5d;
      --button: rgba(65, 55, 47, 0.92);
      --button-hover: rgba(86, 70, 58, 0.96);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      color: var(--dark);
      font-family: 'Montserrat', sans-serif;
      background:
        linear-gradient(rgba(250, 247, 241, 0.24), rgba(250, 247, 241, 0.24)),
        url('https://unlimbot-02.hb.ru-msk.vkcloud-storage.ru/uploads/b49c5e8177dc468cae8914de727acba5596c303891f6da8b.jpg') center / cover fixed no-repeat;
      display: flex;
      justify-content: center;
      padding: 34px 18px 42px;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: -1;
      background: rgba(255, 252, 247, 0.16);
      pointer-events: none;
    }

    .container {
      width: 100%;
      max-width: 440px;
      text-align: center;
    }

    .logo-img {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 19px;
      box-shadow: 0 10px 24px rgba(76, 61, 45, 0.16);
    }

    h1 {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 35px;
      font-weight: 600;
      letter-spacing: .12em;
      margin-bottom: 6px;
    }

    .subtitle {
      color: var(--gold);
      font-size: 10px;
      font-weight: 500;
      letter-spacing: .28em;
      text-transform: uppercase;
      margin-bottom: 13px;
    }

    .description {
      color: var(--muted);
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 21px;
      line-height: 1.18;
      margin: 0 auto 28px;
      text-shadow: 0 1px 12px rgba(255, 255, 255, .6);
    }

    .button-group {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 18px 16px;
      border: 1px solid rgba(255, 255, 255, .2);
      border-radius: 4px;
      color: #fffdf9;
      background: var(--button);
      box-shadow: 0 7px 18px rgba(57, 45, 35, .13);
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: .07em;
      line-height: 1.35;
      transition: background .2s ease, transform .2s ease, box-shadow .2s ease;
    }

    .btn:hover,
    .btn:focus-visible {
      background: var(--button-hover);
      box-shadow: 0 10px 22px rgba(57, 45, 35, .2);
      transform: translateY(-2px);
      outline: none;
    }

    footer {
      margin-top: 31px;
      color: rgba(64, 54, 46, .72);
      font-size: 10px;
      letter-spacing: .18em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <main class="container">
    <img class="logo-img" src="https://unlimbot-03.hb.ru-msk.vkcloud-storage.ru/uploads/0154eb8933ba441792735a5b023b85f89ed6d309390102c5.jpg" alt="Логотип NADI." />

    <h1>NADI.</h1>
    <div class="subtitle">Modest Wear</div>

    <p class="description">
      Элегантность в каждой детали.<br />
      Свадебные и вечерние платья для покрытых девушек.
    </p>

    <nav class="button-group" aria-label="Ссылки NADI.">
      <a class="btn" href="https://t.me/Nadi_modestwear" target="_blank" rel="noopener">ВЕСЬ НАШ АССОРТИМЕНТ</a>
      <a class="btn" href="https://t.me/f_dilas" target="_blank" rel="noopener">ОФОРМИТЬ ЗАКАЗ ЧЕРЕЗ TELEGRAM</a>
      <a class="btn" href="https://wa.me/998997124844" target="_blank" rel="noopener">ОФОРМИТЬ ЗАКАЗ ЧЕРЕЗ WHATSAPP</a>
      <a class="btn" href="tel:+998997124844">ТЕЛЕФОН: +998 99 712 48 44</a>
    </nav>

    <footer>NADI. · Modest Wear</footer>
  </main>
</body>
</html>
